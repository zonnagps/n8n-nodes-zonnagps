# Publishes to npm when a vX.Y.Z tag is pushed, with provenance and trusted publishing (OIDC):
# npm verifies the package comes from this repository and workflow, with no stored token.
name: Publish to npm
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing requires npm 11.5.1 or later.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - name: Check that the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
